[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
priority=10
command=php-fpm -F
stopsignal=QUIT
stopwaitsecs=330
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:teg-deadlines-worker]
priority=40
command=php /var/www/html/artisan schedule:work
autostart=%(ENV_TEG_BACKGROUND_ENABLED)s
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
priority=20
command=nginx -g "daemon off;"
stopsignal=QUIT
stopwaitsecs=330
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:teg-queue-worker]
priority=30
command=php /var/www/html/artisan queue:work --queue=default,deadlines --sleep=3 --tries=3 --max-time=3600
autostart=%(ENV_TEG_BACKGROUND_ENABLED)s
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
stopwaitsecs=3600
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
