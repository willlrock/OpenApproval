# Preserve the numeric client port while retaining Debian's normalized hostname.
map $http_host $openapproval_port_suffix {
    default "";
    ~:(?<openapproval_request_port>[0-9]+)$ ":$openapproval_request_port";
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # This application is an origin server. Reject proxy-style request targets
    # before combining the normalized hostname with the Host header's port.
    if ($request ~* "^[^[:space:]]+[[:space:]]+https?://") { return 400; }

    client_max_body_size 50M;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /storage/signatures/ { deny all; }
    location = /telegram/webhook {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Assets with long cache
    location /build/ {
        expires 1y;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_HOST "$host$openapproval_port_suffix";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 128k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
