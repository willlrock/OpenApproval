[program:teg-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/teg-approval-bot/artisan queue:work --queue=default,deadlines --sleep=3 --tries=3 --max-time=3600
directory=/var/www/teg-approval-bot
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=tegbot
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/teg-approval-bot/storage/logs/queue-worker.log
stopwaitsecs=3600

[program:teg-deadlines-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/teg-approval-bot/artisan schedule:work
directory=/var/www/teg-approval-bot
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=tegbot
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/teg-approval-bot/storage/logs/scheduler.log
stopwaitsecs=60
